<h4>Company Users</h4>
<button
  type="button"
  class="btn btn-outline-primary btn-sm"
  (click)="showAddUser = true"
  *ngIf="isPlatformAdmin"
>
  + Add User
</button>

<div class="card p-3 mb-3" *ngIf="showAddUser">
  <h6>Add User</h6>

  <input
    type="email"
    class="form-control mb-2"
    placeholder="Email"
    [(ngModel)]="newUserEmail"
  />

  <div class="row">
    <div class="col">
      <input
        type="text"
        class="form-control mb-2"
        placeholder="First name"
        [(ngModel)]="firstName"
      />
    </div>
    <div class="col">
      <input
        type="text"
        class="form-control mb-2"
        placeholder="Last name"
        [(ngModel)]="lastName"
      />
    </div>
  </div>

  <input
    type="password"
    class="form-control mb-2"
    placeholder="Temporary password"
    [(ngModel)]="password"
  />

  <select class="form-select mb-2" [(ngModel)]="newUserRole">
    <option value="user">User</option>
    <option value="company_admin">Company Admin</option>
  </select>

  <div class="text-end">
    <button class="btn btn-secondary btn-sm me-2" (click)="showAddUser = false">
      Cancel
    </button>
    <button
      class="btn btn-primary btn-sm"
      (click)="addUserAsPlatformAdmin()"
      [disabled]="!newUserEmail || !password"
    >
      Add User
    </button>
  </div>
</div>


<table class="table table-sm align-middle" *ngIf="users.length">
  <thead>
    <tr>
      <th>Email</th>
      <th>Name</th>
      <th>Role</th>
      <th class="text-end">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.email }}</td>
      <td>{{ user.name || '—' }}</td>
      <td>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="user.role"
          (change)="updateUserRole(user)"
          [disabled]="!isPlatformAdmin"
        >
          <option value="user">User</option>
          <option value="company_admin">Company Admin</option>
        </select>
      </td>
      <td class="text-end">
        <button
          class="btn btn-outline-danger btn-sm"
          (click)="removeUser(user.id)"
          *ngIf="isPlatformAdmin"
        >
          Remove
        </button>
      </td>
    </tr>
  </tbody>
</table>
