<div class="container mt-4">
  <h2>Companies</h2>

  <!-- Create Company -->
  <div class="input-group mb-3">
    <input [(ngModel)]="newCompany" class="form-control" placeholder="New company name" />
    <button class="btn btn-primary" (click)="createCompany()">Add Company</button>
  </div>

  <!-- Company List -->
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>Name</th>
        <th>Website</th>
        <th>Email</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let company of companies">
        <td>{{ company.name }}</td>
        <td>{{ company.website || '—' }}</td>
        <td>{{ company.email || '—' }}</td>
        <td class="text-end">
          <button class="btn btn-outline-primary btn-sm me-2" (click)="editCompany(company)">Edit</button>
          <button class="btn btn-outline-danger btn-sm" (click)="deleteCompany(company.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Edit Modal -->
  <div *ngIf="editingCompany" class="modal-backdrop fade show"></div>
  <div *ngIf="editingCompany" class="modal fade show d-block" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Company</h5>
          <button type="button" class="btn-close" (click)="editingCompany = null"></button>
        </div>
        <div class="modal-body">
          <input [(ngModel)]="editedName" class="form-control" placeholder="Company name" />
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="editingCompany = null">Cancel</button>
          <button class="btn btn-primary" (click)="saveEdit()">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>
