<div class="container" *ngIf="company">

<h1>{{ company.name }}</h1>

<p>
Website: {{ company.website || '—' }}
</p>

<p>
Contact: {{ company.contactEmail || '—' }}
</p>

<hr>

<h2>Members</h2>

<table class="table">

<thead>
<tr>
<th>Email</th>
<th>Role</th>
<th></th>
</tr>
</thead>

<tbody>

<tr *ngFor="let member of members">

<td>{{ member.email }}</td>

<td>

<span *ngIf="member.role === 'company_admin'">
Company Admin
</span>

<span *ngIf="member.role === 'member'">
Member
</span>

</td>

<td *ngIf="isPlatformAdmin">
<button (click)="removeMember(member.id)">Remove</button>
</td>

</tr>

</tbody>

</table>

<hr>

<h2>Campaigns</h2>

<table class="table">

<thead>
<tr>
<th>Campaign</th>
<th>Status</th>
<th>Updated</th>
</tr>
</thead>

<tbody>

<tr *ngFor="let campaign of campaigns">

<td>
<a [routerLink]="['/companies', companyId, 'campaigns', campaign.id]">
{{ campaign.title }}
</a>
</td>

<td>{{ campaign.workflow_status }}</td>

<td>{{ campaign.updated_at | date:'short' }}</td>

</tr>

</tbody>

</table>

</div>
